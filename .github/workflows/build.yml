name: Build, Validate & Release DX Rhythmbox

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  linux-x64:
    name: Linux x64 (VST3 + Standalone + Tests + pluginval)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build & JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config build-essential curl unzip zip xvfb \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure CMake (Ninja Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: cmake --build build --parallel

      - name: Run Catch2 DSP & Plugin test suite
        run: xvfb-run -a ctest --test-dir build --output-on-failure -V

      - name: Download pluginval (Linux)
        run: |
          curl -fL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip" -o pluginval.zip
          unzip -q pluginval.zip -d pluginval_bin
          chmod +x pluginval_bin/pluginval || true

      - name: Validate VST3 plugin with pluginval
        run: |
          PLUGINVAL=$(find pluginval_bin -type f -name "pluginval" | head -n 1)
          chmod +x "$PLUGINVAL"
          xvfb-run -a "$PLUGINVAL" --strictness-level 5 --validate-in-process --output-dir validation-logs \
            "build/DXRhythmbox_artefacts/Release/VST3/DX Rhythmbox.vst3"

      - name: Package Linux release archive
        run: |
          mkdir -p dist_stage dist_out validation-logs
          cp -a "build/DXRhythmbox_artefacts/Release/VST3/DX Rhythmbox.vst3" dist_stage/
          cp -a "build/DXRhythmbox_artefacts/Release/Standalone/DX Rhythmbox" dist_stage/
          for f in README.md LICENSE; do
            [ -f "$f" ] && cp "$f" dist_stage/
          done
          (cd dist_stage && zip -r ../dist_out/DX-Rhythmbox-Linux-x64.zip .)

      - name: Upload Linux release package
        uses: actions/upload-artifact@v4
        with:
          name: DXRhythmbox-Linux-x64-Package
          path: dist_out/*.zip

      - name: Upload Linux validation logs
        uses: actions/upload-artifact@v4
        with:
          name: DXRhythmbox-Linux-x64-Logs
          path: validation-logs/

  macos-universal:
    name: macOS Universal (arm64+x86_64 AU + VST3 + Standalone + pluginval)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Universal arm64;x86_64 Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build all targets
        run: cmake --build build --config Release --parallel

      - name: Run Catch2 DSP & Plugin test suite
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Download pluginval (macOS)
        run: |
          curl -fL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip" -o pluginval.zip
          unzip -q pluginval.zip -d pluginval_bin

      - name: Validate VST3 & AU plugins with pluginval
        run: |
          PLUGINVAL=$(find pluginval_bin -type f -name "pluginval" -perm +111 | head -n 1)
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components" validation-logs

          VST3_DX="build/DXRhythmbox_artefacts/Release/VST3/DX Rhythmbox.vst3"
          AU_DX="build/DXRhythmbox_artefacts/Release/AU/DX Rhythmbox.component"
          cp -R "$AU_DX" "$HOME/Library/Audio/Plug-Ins/Components/"
          "$PLUGINVAL" --strictness-level 5 --validate-in-process --output-dir validation-logs "$VST3_DX"
          "$PLUGINVAL" --strictness-level 5 --validate-in-process --output-dir validation-logs "$AU_DX"

      - name: Package macOS release archive
        run: |
          mkdir -p dist_stage dist_out
          cp -R "build/DXRhythmbox_artefacts/Release/VST3/DX Rhythmbox.vst3" dist_stage/
          cp -R "build/DXRhythmbox_artefacts/Release/AU/DX Rhythmbox.component" dist_stage/
          cp -R "build/DXRhythmbox_artefacts/Release/Standalone/DX Rhythmbox.app" dist_stage/
          for f in README.md LICENSE; do
            [ -f "$f" ] && cp "$f" dist_stage/
          done
          ditto -c -k dist_stage "dist_out/DX-Rhythmbox-macOS-Universal.zip"

      - name: Upload macOS release package
        uses: actions/upload-artifact@v4
        with:
          name: DXRhythmbox-macOS-Universal-Package
          path: dist_out/*.zip

      - name: Upload macOS validation logs
        uses: actions/upload-artifact@v4
        with:
          name: DXRhythmbox-macOS-Universal-Logs
          path: validation-logs/

  windows-x64:
    name: Windows x64 (VST3 + Standalone + Tests + pluginval)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Release)
        run: cmake -B build -A x64

      - name: Build all targets
        run: cmake --build build --config Release --parallel

      - name: Run Catch2 DSP & Plugin test suite
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Download pluginval (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile "pluginval.zip"
          Expand-Archive -Path "pluginval.zip" -DestinationPath "pluginval_bin" -Force

      - name: Validate VST3 plugin with pluginval
        shell: pwsh
        run: |
          $pluginval = Get-ChildItem -Path "pluginval_bin" -Filter "pluginval.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          New-Item -ItemType Directory -Force -Path "validation-logs" | Out-Null
          & $pluginval --strictness-level 5 --validate-in-process --output-dir validation-logs "build\DXRhythmbox_artefacts\Release\VST3\DX Rhythmbox.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_stage, dist_out | Out-Null
          Copy-Item -Recurse "build\DXRhythmbox_artefacts\Release\VST3\DX Rhythmbox.vst3" dist_stage\
          Copy-Item "build\DXRhythmbox_artefacts\Release\Standalone\DX Rhythmbox.exe" dist_stage\
          foreach ($f in @("README.md", "LICENSE")) {
            if (Test-Path $f) { Copy-Item $f dist_stage\ }
          }
          Compress-Archive -Path "dist_stage\*" -DestinationPath "dist_out\DX-Rhythmbox-Windows-x64.zip" -Force

      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: DXRhythmbox-Windows-x64-Package
          path: dist_out/*.zip

      - name: Upload Windows validation logs
        uses: actions/upload-artifact@v4
        with:
          name: DXRhythmbox-Windows-x64-Logs
          path: validation-logs/

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x64, macos-universal, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: DXRhythmbox-*-Package
          path: release-assets
          merge-multiple: true

      - name: Detect pre-release tag
        id: tag_meta
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.tag_meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*.zip
